<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14202a" />
  <title>Yarn Loop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="hud">
    <button id="btn-levels" class="icon-btn" aria-label="레벨 선택">☰</button>
    <div class="title">
      <span id="lv-label">Lv.1</span>
      <span id="lv-name"></span>
      <div class="progress"><div id="progress-fill"></div></div>
    </div>
    <button id="btn-account" class="icon-btn account" aria-label="구글 계정" hidden>👤</button>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
    <button id="btn-restart" class="icon-btn" aria-label="다시 시작">↻</button>
  </header>
  <canvas id="cv"></canvas>
  <div id="toast" role="status"></div>
  <div id="overlay" hidden><div class="card"></div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
