<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14202a" />
  <title>Yarn Loop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Outfit:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="hud">
    <button id="btn-home" class="icon-btn" aria-label="시작 화면">⌂</button>
    <div class="title">
      <span id="lv-label">Lv.1</span>
      <span id="lv-name"></span>
      <div class="progress"><div id="progress-fill"></div></div>
    </div>
    <button id="btn-mute" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
    <button id="btn-restart" class="icon-btn" aria-label="다시 시작">↻</button>
  </header>
  <canvas id="cv"></canvas>

  <section id="start" hidden>
    <div class="start-wrap">
      <header class="logo">
        <div class="logo-rule"><span></span>✦<span></span></div>
        <h1>Yarn Loop</h1>
        <p class="tagline">실을 감아 완성하는 뜨개 퍼즐</p>
      </header>
      <canvas id="preview" aria-hidden="true"></canvas>
      <p id="start-progress" class="start-progress"></p>
      <div class="start-actions">
        <button id="start-play" class="btn primary big"></button>
        <div class="start-row">
          <button id="start-levels" class="btn">레벨 선택</button>
          <button id="start-ranking" class="btn" hidden>🏆 랭킹</button>
        </div>
        <button id="start-account" class="account-chip" hidden></button>
      </div>
    </div>
  </section>

  <div id="toast" role="status"></div>
  <div id="overlay" hidden><div class="card"></div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
